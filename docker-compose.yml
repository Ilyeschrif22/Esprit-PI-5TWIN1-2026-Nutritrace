services:
  mysql:
    image: mysql:8.0
    container_name: nutritrace-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: nutritrace
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: nutritrace
      MYSQL_PASSWORD: nutritrace

    ports:
      - "3306:3306"

    volumes:
      - nutritrace_mysql_data:/var/lib/mysql

    command: --default-authentication-plugin=mysql_native_password

volumes:
  nutritrace_mysql_data: